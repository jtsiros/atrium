[package]
name = "atriumd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Home Assistant bridge daemon for the Atrium Omarchy plugin"
license = "MIT"
repository = "https://github.com/bitshiftxr/atrium"

[lib]
name = "atriumd"
path = "src/lib.rs"

[[bin]]
name = "atriumd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
